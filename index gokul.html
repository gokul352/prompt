  useEffect(()=>{
    const h=()=>setFs(!!document.fullscreenElement),k=e=>{if(e.key==='Escape')setFake(false)};
    const vis=()=>{if(REMOTE&&!document.hidden&&!adminRef.current)loadRemote().catch(()=>{})};
    document.addEventListener('fullscreenchange',h);addEventListener('keydown',k);document.addEventListener('visibilitychange',vis);
    if(REMOTE){setSt('Loading…');loadRemote().catch(()=>setSt('Couldn’t load the saved images. Please check the Supabase settings.'))}
    else setSt('Storage isn’t connected yet, so images and prompts are saved on this device only. See README.md to connect Supabase.');
    return()=>{document.removeEventListener('fullscreenchange',h);removeEventListener('keydown',k);document.removeEventListener('visibilitychange',vis)};
  },[]);

  const both=!!(before&&after),base=before||after;
  useEffect(()=>{
    if(!both){seen.current[cur]=false;return}
    if(seen.current[cur])return;
    seen.current[cur]=true;
    const t0=performance.now();let id;
    const f=t=>{const k=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-k,3);setPos(100-50*e);if(k<1)id=requestAnimationFrame(f)};
    id=requestAnimationFrame(f);
    return()=>cancelAnimationFrame(id);
  },[both,cur]);

  const ratio=base?base.w/base.h:16/9,full=fs||fake;
  const moveTo=e=>{const r=stage.current.getBoundingClientRect();setPos(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)))};
  const down=e=>{if(!both||mode!=='compare')return;drag.current=true;e.currentTarget.setPointerCapture(e.pointerId);moveTo(e)};
  const key=e=>{const s=e.shiftKey?10:2;if(e.key==='ArrowLeft'){e.preventDefault();setPos(p=>Math.max(0,p-s))}if(e.key==='ArrowRight'){e.preventDefault();setPos(p=>Math.min(100,p+s))}};
  const toggleFs=async()=>{
    if(document.fullscreenElement){document.exitFullscreen();return}
    if(fake){setFake(false);return}
    try{await ws.current.requestFullscreen()}catch(e){setFake(true)}
  };

  const local=async(k,obj,i)=>{
    try{
      const data=shrink(obj),im={url:data,name:obj.name,local:true,el:obj.el,w:obj.w,h:obj.h};
      setSets(a=>a.map((s,j)=>j===i?{...s,[k]:im}:s));
      toast(persist(i,{[k]:{url:data,name:obj.name}})?'Image added (this device only)':'Image added, but device storage is full – it will be lost on refresh');
    }catch(e){toast('Couldn’t add this image. Try a smaller file.')}
  };
  const put=k=>async(obj)=>{
    const i=cur;
    if(!REMOTE){await local(k,obj,i);return}
    try{
      toast('Saving…');
      const data=shrink(obj,1280),c=creds.current;
      await rpc('save_image',{p_user:c.u,p_pw:c.p,p_id:i,p_slot:k,p_data:data,p_name:obj.name});
      const el=await decode(data);
      setSets(a=>a.map((s,j)=>j===i?{...s,[k]:{url:data,remote:data,name:obj.name,el,w:el.naturalWidth,h:el.naturalHeight}}:s));
      toast('Saved – everyone can see it now');
    }catch(e){toast('Couldn’t save: '+(e.message||e))}
  };
  const del=k=>async()=>{
    const i=cur;
    if(!REMOTE){upd(k)(null);persist(i,{[k]:null});return}
    try{const c=creds.current;await rpc('save_image',{p_user:c.u,p_pw:c.p,p_id:i,p_slot:k,p_data:null,p_name:null});setSets(a=>a.map((s,j)=>j===i?{...s,[k]:null}:s));toast('Image removed')}
    catch(e){toast('Couldn’t remove: '+(e.message||e))}
  };
  const swap=async()=>{
    if(REMOTE){
      try{const c=creds.current;await rpc('swap_images',{p_user:c.u,p_pw:c.p,p_id:cur});setBefore(after);setAfter(before);toast('Images swapped')}
      catch(e){toast('Couldn’t swap: '+(e.message||e))}
      return;
    }
    setBefore(after);setAfter(before);persist(cur,{before:mini(after),after:mini(before)});
    toast('Images swapped');
  };
  const save=async()=>{
    if(!text.trim()){toast('Paste a prompt first');return}
    if(!REMOTE){toast(persist(cur,{text})?'Prompt saved (this device only)':'Couldn’t save – device storage is full');return}
    try{const c=creds.current;await rpc('save_prompt',{p_user:c.u,p_pw:c.p,p_id:cur,p_text:text});toast('Prompt saved – everyone can see it now')}
    catch(e){toast('Couldn’t save: '+(e.message||e))}
  };
  const copy=async()=>{if(!text){toast('Nothing to copy yet');return}toast(await copyText(text)?'Prompt copied':'Copy failed')};

  const download=()=>{
    try{
      let W=base.w,H=base.h;const s=Math.min(1,4096/Math.max(W,H));W=Math.round(W*s);H=Math.round(H*s);
      const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
      x.fillStyle='#f1f3f4';x.fillRect(0,0,W,H);
      const fit=im=>{const k=Math.min(W/im.w,H/im.h),w=im.w*k,h=im.h*k;x.drawImage(im.el,(W-w)/2,(H-h)/2,w,h)};
      const tag=(t,left)=>{const f=Math.max(12,W/60);x.font='600 '+f+'px sans-serif';const w=x.measureText(t).width+f*1.6,h=f*2,m=f,px=left?m:W-w-m;x.fillStyle='rgba(32,33,36,.72)';x.beginPath();if(x.roundRect)x.roundRect(px,m,w,h,h/2);else x.rect(px,m,w,h);x.fill();x.fillStyle='#fff';x.textBaseline='middle';x.fillText(t,px+f*.8,m+h/2)};
      if(mode==='before'){fit(before);tag('BEFORE',true)}
      else if(mode==='after'){fit(after);tag('AFTER',false)}
      else{
        const px=W*pos/100;fit(before);
        x.save();x.beginPath();x.rect(px,0,W-px,H);x.clip();fit(after);x.restore();
        const lw=Math.max(2,W/400),r=Math.max(20,W/45);
        x.fillStyle='#fff';x.fillRect(px-lw/2,0,lw,H);
        x.save();x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=r/2;x.beginPath();x.arc(px,H/2,r,0,7);x.fill();x.restore();
        x.fillStyle='#1a73e8';const a=r*.38;
        x.beginPath();x.moveTo(px-r*.2,H/2-a);x.lineTo(px-r*.2-a,H/2);x.lineTo(px-r*.2,H/2+a);x.fill();
        x.beginPath();x.moveTo(px+r*.2,H/2-a);x.lineTo(px+r*.2+a,H/2);x.lineTo(px+r*.2,H/2+a);x.fill();
        tag('BEFORE',true);tag('AFTER',false);
      }
      c.toBlob(async b=>{
        if(!b){toast('Couldn’t create the image');return}
        try{
          if(dl)await dl.save({filename:NAMES[cur].toLowerCase().replace(/\s+/g,'-')+'.png',data:b});
          else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=NAMES[cur].toLowerCase().replace(/\s+/g,'-')+'.png';document.body.appendChild(a);a.click();a.remove()}
        }catch(e){if(!e||e.code!=='declined')toast('Download didn’t complete')}
      },'image/png');
    }catch(e){toast('Download isn’t available for these images')}
  };

  const doLogin=async()=>{
    const u=cred.u.trim(),p=cred.p;let ok=false;
    try{
      if(REMOTE)ok=(await rpc('check_admin',{p_user:u,p_pw:p}))===true;
      else ok=(await sha(u+':'+p))===LOCAL_HASH;
    }catch(e){
      const m=String((e&&e.message)||e);
      toast(!REMOTE?'Open the page over https (or localhost) to log in.'
        :/find the function|schema cache|does not exist|PGRST202/i.test(m)?'Database setup isn’t finished. Run the SQL in Supabase first.'
        :/Failed to fetch|NetworkError|Load failed/i.test(m)?'Couldn’t reach Supabase. Check the internet and the URL.'
        :/Invalid API key|JWT|apikey/i.test(m)?'The Supabase key looks wrong. Check SUPABASE_KEY.'
        :'Login error: '+m);
      return}
    if(ok){creds.current={u,p};setAuth(true);setLogin(false);setCred({u:'',p:''});setBad(0);toast('Admin panel unlocked – add your images below');setTimeout(()=>{const x=document.getElementById('upload');x&&x.scrollIntoView({behavior:'smooth',block:'start'})},150)}
    else setBad(n=>n+1);
  };
  const cls=m=>'btn'+(mode===m?' on':'');
  return html`<${React.Fragment}>
  <div className="bg"><i></i><i></i><i></i></div>
  <header><div className="hd">
    <div className="brand"><i></i>Gokul</div>
    <nav>${admin&&html`<a href="#upload">Add Images</a>`}<a href="#compare">Compare</a><a href="#prompt">Prompt</a></nav>
    <div style=${{marginLeft:'auto',display:'flex',gap:8}}>
      <button className=${'btn'+(auth?' on':'')} onClick=${()=>{if(auth){setAuth(false);creds.current={u:'',p:''};toast('Admin panel locked')}else setLogin(true)}}>${auth?'🔓 Lock':'🔒 Admin'}</button>
      <button className="btn" onClick=${()=>setTheme(theme==='dark'?'light':'dark')} aria-label="Toggle light and dark mode">${theme==='dark'?'☀ Light':'☾ Dark'}</button>
    </div>
  </div></header>
  <main>
    <section><h1>Before & After Compare</h1>
      <p className="sub">${admin?'Admin panel: images and prompts you save here are published for every visitor.':'Drag the divider to compare. Content is managed by the site admin.'}</p>
      ${st&&html`<p className="sub" style=${{fontSize:13,marginTop:4}}>${st}</p>`}</section>
    <section className="tabs" aria-label="Image sets"><span className="sub">Image set</span>${sets.map((s,i)=>html`<button key=${i} className=${'tab'+(i===cur?' on':'')+(s.before&&s.after?' done':'')} style=${{animationDelay:i*70+'ms'}} onClick=${()=>setCur(i)} title=${NAMES[i]} aria-label=${(i+1)+'. '+NAMES[i]}>${i+1}</button>`)}</section>
    <section id="upload" className=${admin?'':''} style=${{display:admin?undefined:'none'}}>
      ${admin&&html`<h2>Add images · ${NAMES[cur]}</h2>`}
      <div className=${admin?'grid2':''}>
      ${admin&&html`<${Upload} label="BEFORE" img=${before} onChange=${put('before')} onRemove=${del('before')} toast=${toast}/>`}
      ${admin&&html`<${Upload} label="AFTER" img=${after} onChange=${put('after')} onRemove=${del('after')} toast=${toast}/>`}
      </div>
    </section>
    <section id="compare">
      <div ref=${ws} className=${'card ws'+(full?' full':'')+(fake?' fake':'')}>
        <div key=${'n'+cur} className="setname"><span className="num">${cur+1}</span><span className="nm">${NAMES[cur]}</span></div>
        <div key=${cur} ref=${stage} className=${'stage'+(both&&mode==='compare'?'':' still')} style=${{'--r':ratio}}
          onPointerDown=${down} onPointerMove=${e=>drag.current&&moveTo(e)} onPointerUp=${()=>{drag.current=false}} onPointerCancel=${()=>{drag.current=false}}>
          ${!both?html`<div className="empty">${admin?(base?'Add the '+(before?'AFTER':'BEFORE')+' image to publish this comparison.':'Upload a BEFORE and an AFTER image to publish this comparison.'):'Nothing published in this set yet.'}</div>`:html`
            <div className="layer" style=${{opacity:mode==='after'?0:1}}><img src=${before.url} alt="Before"/></div>
            <div className="layer" style=${{opacity:mode==='before'?0:1,clipPath:mode==='compare'?'inset(0 0 0 '+pos+'%)':'none'}}><img src=${after.url} alt="After"/></div>
            ${mode!=='after'&&html`<span className="pill" style=${{left:12}}>BEFORE</span>`}
            ${mode!=='before'&&html`<span className="pill" style=${{right:12}}>AFTER</span>`}
            ${mode==='compare'&&html`<div className="line" style=${{left:pos+'%'}}></div>
              <div className="handle" style=${{left:pos+'%'}} tabIndex="0" role="slider" aria-label="Comparison slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${Math.round(pos)} onKeyDown=${key}>
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>
              </div>`}`}
        </div>
        <div className="ctrl">
          <button className="btn" disabled=${!both} onClick=${()=>setPos(50)}>Reset</button>
          <button className=${cls('before')} disabled=${!both} onClick=${()=>setMode('before')}>Before</button>
          <button className=${cls('after')} disabled=${!both} onClick=${()=>setMode('after')}>After</button>
          <button className=${cls('compare')} disabled=${!both} onClick=${()=>setMode('compare')}>Compare</button>
          ${admin&&html`<button className="btn" disabled=${!before&&!after} onClick=${swap}>Swap</button>`}
          <button className="btn" disabled=${!both} onClick=${toggleFs}>${full?'Exit fullscreen':'Fullscreen'}</button>
          <button className="btn pri" disabled=${!both} onClick=${download}>Download</button>
        </div>
      </div>
    </section>
    <section id="prompt" className="card">
      <h2>Add Here Prompt <span className="sub" style=${{fontWeight:400,fontSize:14}}>· ${NAMES[cur]}</span></h2>
      <textarea value=${text} onChange=${e=>admin&&setText(e.target.value)} readOnly=${!admin} placeholder=${admin?'Paste your existing prompt here...':'No prompt published for this set yet.'} aria-label="Prompt"></textarea>
      <div className="meta">
        <span className="cnt">${text.length} characters</span>
        <button className="btn" onClick=${copy}>Copy Prompt</button>
        ${admin&&html`<button className="btn pri" onClick=${save}>Save Prompt</button>`}
      </div>
    </section>
  </main>
  ${login&&html`<div className="ov" onClick=${()=>setLogin(false)}><div className=${'modal'+(bad?(bad%2?' bad':' bad2'):'')} onClick=${e=>e.stopPropagation()} role="dialog" aria-label="Admin login">
    <h2>Admin login</h2><p className="sub">Enter your details to open the admin panel.</p>
    <label>Username</label><input autoFocus value=${cred.u} onChange=${e=>setCred({...cred,u:e.target.value})} onKeyDown=${e=>e.key==='Enter'&&doLogin()} autoComplete="username"/>
    <label>Password</label><input type="password" value=${cred.p} onChange=${e=>setCred({...cred,p:e.target.value})} onKeyDown=${e=>e.key==='Enter'&&doLogin()} autoComplete="current-password"/>
    <div className="err">${bad?'Incorrect username or password.':''}</div>
    <div className="row" style=${{justifyContent:'flex-end',marginTop:0}}><button className="btn ghost" onClick=${()=>setLogin(false)}>Cancel</button><button className="btn pri" onClick=${doLogin}>Unlock</button></div>
  </div></div>`}
  ${msg&&html`<div className="toast" role="status">${msg}</div>`}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
